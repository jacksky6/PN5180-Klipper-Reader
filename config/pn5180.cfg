# Example PN5180 Klipper configuration.
#
# Adjust the MCU prefix, SPI bus, CS pin, and reset pin for your board.
# The reset pin is required. Do not tie RST only to 3.3V if you want Klipper
# to recover the PN5180 after a communication lockup.

[pn5180 mmu_reader]
spi_bus: spi2_PB14_PB15_PB13
cs_pin: mmu:PA8
reset_pin: mmu:PC7

# Start conservative. After wiring and power are stable, 500000 or 1000000 can
# be tested, but the main delays are usually RF waits rather than SPI transfer.
spi_speed: 100000

# Period for READ=1 background scanning.
scan_period: 6.0

# Klipper connection automatically starts background reading when True.
read_on_start: False

# ntag: common NTAG213/215/216 stickers, recommended default.
# openprinttag: Prusa/OpenPrintTag style ISO15693 / ICODE SLIX2 tags.
# auto: tries both, useful for testing but does more work every scan.
tag_format: ntag

# Dispatch detected spool ids to Happy Hare with MMU_GATE_MAP NEXT_SPOOLID=<id>.
# Set False if Happy Hare is not installed or you only want to print the ID.
happyhare_enable: True

# Keep True while testing. Set False for normal use.
debug_log: True

# Conservative PN5180 timing defaults.
command_delay: 0.005
rf_timeout: 0.05
rf_on_delay: 0.05
page_read_retries: 2
